<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZF CAI // Mission Operator Console</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cockpit: '#07090e',
            hud: '#0b0f17',
            cardbg: '#0e131b',
            accent: '#00d2ff',
          },
          fontFamily: {
            sans: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            tech: ['Chakra Petch', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    .grid-matrix {
      background-image: radial-gradient(rgba(0, 210, 255, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-cockpit text-slate-100 min-h-screen flex items-center justify-center p-3 md:p-6 lg:p-10 font-sans grid-matrix">

  <!-- Outer Container Frame -->
  <div class="w-full max-w-5xl rounded-2xl md:rounded-3xl border border-slate-800 bg-hud shadow-[0_0_50px_rgba(0,0,0,0.9)] overflow-hidden">

    <!-- Top Console Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-cyan-500/20 bg-[#07090e]/95">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg border border-cyan-400/40 bg-cyan-950/40 shadow-[0_0_15px_rgba(0,210,255,0.25)]">
          <svg class="h-5 w-5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div>
          <span class="font-mono text-[10px] uppercase tracking-widest text-slate-500 block">Restricted Access // ASIL-D Node</span>
          <h1 class="text-sm font-black tracking-wider text-slate-100 uppercase font-tech">Mission Operator Console</h1>
        </div>
      </div>
      <a href="/" class="flex items-center gap-1.5 rounded-lg border border-slate-800 bg-[#0d121d] px-3.5 py-1.5 font-mono text-xs text-slate-300 hover:border-cyan-500/40 hover:text-cyan-400 transition">
        &larr; BACK TO HUD
      </a>
    </header>

    <!-- SECTION 1: LOGIN VIEW -->
    <section id="login-view" class="p-8 lg:p-12">
      <div class="max-w-md mx-auto space-y-6">
        <div class="text-center space-y-2">
          <div class="inline-flex items-center gap-2 rounded-full border border-cyan-500/30 bg-cyan-950/30 px-3 py-1 font-mono text-[11px] text-cyan-300">
            <span class="h-1.5 w-1.5 rounded-full bg-cyan-400 animate-ping"></span>
            OPERATOR AUTHENTICATION REQUIRED
          </div>
          <h2 class="text-2xl font-bold uppercase text-white font-tech">Secure Uplink Login</h2>
          <p class="font-mono text-xs text-slate-500">DEFAULT: <span class="text-slate-400">zf_operator</span> / <span class="text-slate-400">telemetry@2026</span></p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="rounded-xl border border-slate-800 bg-cardbg p-6 space-y-4 shadow-xl">
          <div>
            <label class="block font-mono text-xs text-slate-400 mb-1.5 uppercase">Operator ID</label>
            <input id="login-user" required type="text" value="zf_operator" class="w-full rounded-lg border border-slate-800 bg-cockpit px-3.5 py-2 font-mono text-xs text-white focus:border-cyan-400 focus:outline-none" />
          </div>

          <div>
            <label class="block font-mono text-xs text-slate-400 mb-1.5 uppercase">Security Passkey</label>
            <input id="login-pass" required type="password" placeholder="••••••••••••" class="w-full rounded-lg border border-slate-800 bg-cockpit px-3.5 py-2 font-mono text-xs text-white focus:border-cyan-400 focus:outline-none" />
          </div>

          <button type="submit" class="w-full rounded-lg bg-cyan-500 py-2.5 font-mono text-xs font-bold uppercase tracking-wider text-black hover:bg-cyan-400 transition shadow-[0_0_20px_rgba(0,210,255,0.3)]">
            Verify Identity
          </button>

          <p id="login-err" class="hidden font-mono text-xs text-rose-400 text-center"></p>
        </form>
      </div>
    </section>

    <!-- SECTION 2: AUTHENTICATED DASHBOARD (Hidden by default) -->
    <section id="dashboard-view" class="hidden p-8 lg:p-12 space-y-8">

      <!-- Session Bar -->
      <div class="flex flex-wrap items-center justify-between rounded-xl border border-emerald-500/20 bg-emerald-950/20 px-5 py-3 font-mono text-xs text-emerald-400">
        <div class="flex items-center gap-2">
          <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>OPERATOR ACTIVE: <strong id="session-user">zf_operator</strong></span>
        </div>
        <button onclick="handleLogout()" class="text-slate-400 hover:text-rose-400 uppercase tracking-widest text-[11px] underline underline-offset-4">
          Terminate Session [Logout]
        </button>
      </div>

      <!-- Grid: Ingest Project (Left) + View Transmissions (Right) -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Add Research Project -->
        <div class="lg:col-span-6 rounded-xl border border-slate-800 bg-cardbg p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="font-tech text-base font-bold uppercase text-white tracking-wider">// Ingest Project</h3>
            <span class="font-mono text-[10px] text-cyan-400">SQLITE DB SYNC</span>
          </div>

          <form id="project-form" onsubmit="handleCreateProject(event)" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-mono text-[10px] text-slate-400 mb-1 uppercase">Project Code</label>
                <input id="proj-code" required placeholder="03: PROJ-003" class="w-full rounded-md border border-slate-800 bg-cockpit px-3 py-1.5 font-mono text-xs text-white focus:border-cyan-400 focus:outline-none" />
              </div>
              <div>
                <label class="block font-mono text-[10px] text-slate-400 mb-1 uppercase">Technical Lead</label>
                <input id="proj-lead" required placeholder="Dr. Alex Vance" class="w-full rounded-md border border-slate-800 bg-cockpit px-3 py-1.5 font-mono text-xs text-white focus:border-cyan-400 focus:outline-none" />
              </div>
            </div>

            <div>
              <label class="block font-mono text-[10px] text-slate-400 mb-1 uppercase">Project Title</label>
              <input id="proj-title" required placeholder="FlexRay CAN-FD Gateway Module" class="w-full rounded-md border border-slate-800 bg-cockpit px-3 py-1.5 font-mono text-xs text-white focus:border-cyan-400 focus:outline-none" />
            </div>

            <div>
              <label class="block font-mono text-[10px] text-slate-400 mb-1 uppercase">Summary Description</label>
              <textarea id="proj-desc" required rows="2" placeholder="ASIL-D compliant gateway specs..." class="w-full rounded-md border border-slate-800 bg-cockpit px-3 py-1.5 font-mono text-xs text-white focus:border-cyan-400 focus:outline-none"></textarea>
            </div>

            <div>
              <label class="block font-mono text-[10px] text-slate-400 mb-1 uppercase">Tech Tags (Comma separated)</label>
              <input id="proj-tags" required placeholder="AUTOSAR, C++, RTLAB, CANopen" class="w-full rounded-md border border-slate-800 bg-cockpit px-3 py-1.5 font-mono text-xs text-white focus:border-cyan-400 focus:outline-none" />
            </div>

            <button type="submit" class="w-full rounded-md bg-cyan-500 py-2 font-mono text-xs font-bold uppercase text-black hover:bg-cyan-400 transition">
              Ingest Into Research Grid
            </button>
            <p id="proj-status" class="hidden font-mono text-xs text-cyan-300"></p>
          </form>
        </div>

        <!-- Ingested Transmissions Log -->
        <div class="lg:col-span-6 rounded-xl border border-slate-800 bg-cardbg p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="font-tech text-base font-bold uppercase text-white tracking-wider">// Secure Transmission Log</h3>
            <button onclick="fetchTransmissions()" class="font-mono text-[10px] text-cyan-400 hover:underline uppercase">
              [Refresh Log]
            </button>
          </div>

          <div id="tx-log-container" class="space-y-3 max-h-[340px] overflow-y-auto pr-1">
            <p class="font-mono text-xs text-slate-500">Querying mission buffer...</p>
          </div>
        </div>

      </div>
    </section>

  </div>

  <!-- Operational JavaScript -->
  <script>
    let authToken = localStorage.getItem('zf_token') || null;

    // Check existing session on load
    if (authToken) {
      showDashboard();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errEl = document.getElementById('login-err');
      errEl.classList.add('hidden');

      const formData = new URLSearchParams();
      formData.append('username', document.getElementById('login-user').value);
      formData.append('password', document.getElementById('login-pass').value);

      try {
        const res = await fetch('/api/v1/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });

        if (res.ok) {
          const data = await res.json();
          authToken = data.access_token;
          localStorage.setItem('zf_token', authToken);
          showDashboard();
        } else {
          errEl.innerText = '> AUTH REJECTED: Invalid Operator Credentials';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        errEl.innerText = '> SYSTEM ERROR: Backend server unreachable on port 8000';
        errEl.classList.remove('hidden');
      }
    }

    function showDashboard() {
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');
      fetchTransmissions();
    }

    function handleLogout() {
      authToken = null;
      localStorage.removeItem('zf_token');
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
    }

    async function handleCreateProject(e) {
      e.preventDefault();
      const statusEl = document.getElementById('proj-status');
      statusEl.classList.remove('hidden');
      statusEl.innerText = '> Ingesting project payload...';

      const payload = {
        project_code: document.getElementById('proj-code').value,
        title: document.getElementById('proj-title').value,
        lead: document.getElementById('proj-lead').value,
        description: document.getElementById('proj-desc').value,
        tech_tags: document.getElementById('proj-tags').value,
      };

      try {
        const res = await fetch('/api/v1/admin/projects', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          statusEl.innerText = '> SUCCESS: Project registered in live database.';
          document.getElementById('project-form').reset();
        } else {
          statusEl.innerText = '> ERROR: Project Code already exists or session expired.';
        }
      } catch (err) {
        statusEl.innerText = '> NETWORK ERROR: Transmission dropped.';
      }
    }

    async function fetchTransmissions() {
      const container = document.getElementById('tx-log-container');
      try {
        const res = await fetch('/api/v1/admin/transmissions', {
          headers: { 'Authorization': `Bearer ${authToken}` }
        });

        if (res.ok) {
          const logs = await res.json();
          if (logs.length === 0) {
            container.innerHTML = '<p class="font-mono text-xs text-slate-500">No public transmissions logged yet.</p>';
            return;
          }
          container.innerHTML = logs.map(tx => `
            <div class="rounded-lg border border-slate-800/80 bg-cockpit p-3 font-mono text-xs space-y-1">
              <div class="flex justify-between text-cyan-400">
                <span class="font-bold">${tx.subject_id}</span>
                <span class="text-[10px] text-slate-500">${new Date(tx.timestamp).toLocaleTimeString()}</span>
              </div>
              <p class="text-slate-400 text-[11px] truncate">FROM: ${tx.return_address}</p>
              <p class="text-slate-300 text-[11px] bg-[#0d121d] p-2 rounded border border-slate-800/50">${tx.encrypted_payload}</p>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p class="font-mono text-xs text-rose-400">Session expired. Please log in again.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p class="font-mono text-xs text-rose-400">Failed to stream dispatch buffer.</p>';
      }
    }
  </script>
</body>
</html>
